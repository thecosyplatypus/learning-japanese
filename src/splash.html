<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learning Japanese</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: transparent;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .box {
    width: 360px; height: 400px;
    background: #f8f7f5;
    border-radius: 24px;
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
  }
  .mark {
    width: 76px; height: 76px; border-radius: 19px;
    background: #d9534f; color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 38px;
    font-family: "Yu Gothic UI", "Meiryo", sans-serif;
    box-shadow: 0 12px 26px rgba(217,83,79,.38);
  }
  .name { font-weight: 700; font-size: 16px; color: #1f2937; letter-spacing: .01em; }
  .sub  { font-size: 12px; color: #6b7280; text-align: center; }
  .ring {
    width: 26px; height: 26px; border-radius: 50%;
    border: 3px solid #e5e7eb; border-top-color: #d9534f;
    margin-top: 6px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">か</div>
    <div>
      <div class="name">Learning Japanese</div>
      <div class="sub">Loading your kana…</div>
    </div>
    <div class="ring"></div>
  </div>
</body>
</html>
