<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">

    <a class="brand" href="#" data-route="home">

      <span class="brand-name">Learning Japanese</span>
      <span class="brand-offline">· offline</span>

    <div class="topbar-spacer"></div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <nav class="nav">
        <a class="nav-item" href="#" data-route="home">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>

<div id="toast" class="toast" hidden></div>

<script src="kana-data.js"></script>
